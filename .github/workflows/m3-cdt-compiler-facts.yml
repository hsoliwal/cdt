name: M3 original CDT scanner facts acceptance

on:
  pull_request:
    paths:
      - 'core/org.eclipse.cdt.core/model/org/eclipse/cdt/core/settings/model/M3CdtCompilerFacts.java'
      - 'core/org.eclipse.cdt.core.tests/model/org/eclipse/cdt/core/settings/model/M3CdtCompilerFactsTest.java'
      - 'core/org.eclipse.cdt.core.tests/resources/m3-cdt-compiler-facts-v1.fixture'
      - 'm3/**'
      - '.github/workflows/m3-cdt-compiler-facts.yml'
  push:
    branches: [main]
    paths:
      - 'core/org.eclipse.cdt.core/model/org/eclipse/cdt/core/settings/model/M3CdtCompilerFacts.java'
      - 'core/org.eclipse.cdt.core.tests/model/org/eclipse/cdt/core/settings/model/M3CdtCompilerFactsTest.java'
      - 'm3/**'
      - '.github/workflows/m3-cdt-compiler-facts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cdt-settings:
    name: Native CDT settings and scanner JUnit (JDK 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Install CDT native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential gcc g++ gdb gdbserver xvfb
      - name: Allow gdb to attach to test processes (as Build and Test does)
        # dsf-gdb attach tests fail with "Cannot attach to process: Operation not
        # permitted" under the runner's default Yama ptrace_scope of 1.
        run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - name: Compile and run original CDT/Tycho test suite without ignored failures
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a mvn -B -V \
            clean verify \
            -Dmaven.test.failure.ignore=false \
            -DskipTests=false \
            -DexcludedGroups=flakyTest,slowTest,jdt-ui-bug \
            -Dindexer.timeout=300 \
            -Ddsf.gdb.tests.timeout.multiplier=50 \
            -Dsurefire.rerunFailingTestsCount=0
      - name: Require original four CDT scanner facts JUnit tests, zero skips and failures
        run: |
          java m3/tools/M3CdtTestReceiptMain.java \
            core/org.eclipse.cdt.core.tests/target/surefire-reports
      - name: Retain original CDT scanner test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-cdt-scanner-facts-jdk25
          path: |
            core/org.eclipse.cdt.core.tests/target/surefire-reports/**
            core/org.eclipse.cdt.core.tests/target/*.log
          if-no-files-found: ignore
          retention-days: 14
