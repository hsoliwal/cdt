name: Unit Test Results

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed

jobs:
  unit-test-results:
    name: Unit Test Results
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion != 'skipped'
    # The fork's default GITHUB_TOKEN is read-only, so creating the check run failed
    # with 403. These are the permissions publish-unit-test-result-action documents
    # for workflow_run use; actions: read lets the download step read the artifact.
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
      actions: read

    steps:
      - name: Download Test Report
        uses: dawidd6/action-download-artifact@v7
        with:
          name: test-results
          path: test-results
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
      - name: Publish Test Report as GitHub PR Comment
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          junit_files: "test-results/**/*.xml"
          event_file: test-results/event.json
          event_name: ${{ github.event.workflow_run.event }}
